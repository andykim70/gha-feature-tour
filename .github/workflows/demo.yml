#  SELF-REPOSITORY SYNTAX (new July 2026, needs runner >= 2.336.0):
#  `$/` resolves to this repo at the exact running commit, with no checkout.
#  It is now the recommended way to compose in-repo actions, because it does
#  not defeat SHA pinning the way a hardcoded version does.
#
#    - uses: $/.github/actions/greet
#
#  We use `./.github/actions/greet` above because it works everywhere today.
